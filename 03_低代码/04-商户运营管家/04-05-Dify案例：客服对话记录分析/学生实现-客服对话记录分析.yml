    - data:
        code: "import json\n\ndef main(raw_rows):\n    \"\"\"\n    输入: raw_rows (上一个节点输出的\
          \ Excel 行列表)\n    输出: 增加了 structured_dialogue 字段的新列表\n    \"\"\"\n    new_rows\
          \ = []\n    \n    # 1. 遍历每一行 Excel 数据\n    for row in raw_rows:\n      \
          \  # 复制对象，避免修改原数据（好习惯）\n        current_row = row.copy()\n        \n   \
          \     # 获取原始对话字符串，如果为空则给默认值\n        history_msg = row.get('history_message',\
          \ '')\n        \n        # --- 核心逻辑：切分与角色分配 ---\n        if history_msg:\n\
          \            # 按 \\t 切割\n            parts = history_msg.split('\\t')\n\
          \            \n            dialogue_list = []\n            for index, content\
          \ in enumerate(parts):\n                content = content.strip()\n    \
          \            if not content: continue # 跳过空内容\n                \n      \
          \          # 偶数 (0, 2, 4...) 是用户，奇数 (1, 3, 5...) 是客服\n                role\
          \ = \"User\" if index % 2 == 0 else \"Agent\"\n                \n      \
          \          dialogue_list.append({\n                    \"role\": role,\n\
          \                    \"content\": content\n                })\n        \
          \    \n            # 将处理好的结构化对话存入新字段\n            current_row['structured_dialogue']\
          \ = dialogue_list\n            \n            # 为了方便 LLM 阅读，也可以生成一个纯文本版本\n\
          \            # 格式如：\n            # User: xxx\n            # Agent: xxx\n\
          \            text_buffer = []\n            for item in dialogue_list:\n\
          \                text_buffer.append(f\"{item['role']}: {item['content']}\"\
          )\n            current_row['dialogue_text'] = \"\\n\".join(text_buffer)\n\
          \            \n        else:\n            current_row['structured_dialogue']\
          \ = []\n            current_row['dialogue_text'] = \"\"\n\n        new_rows.append(current_row)\n\
          \n    # 返回处理后的完整列表\n    return {\n        \"processed_rows\": new_rows\n\
          \    }"
        code_language: python3
        outputs:
          processed_rows:
            children: null
            type: array[object]
        selected: false
