    - data:
        code: "import urllib.request\nimport io\nimport zipfile\nimport xml.etree.ElementTree\
          \ as ET\nimport ssl\n\ndef main(file_url):\n    # 遇到错误或空输入时的默认返回值\n    empty_result\
          \ = {\"rows\": []}\n\n    if not file_url:\n        return empty_result\n\
          \n    try:\n        # --- 1. 下载文件 (忽略 SSL 证书) ---\n        ssl_context =\
          \ ssl._create_unverified_context()\n        headers = {'User-Agent': 'Mozilla/5.0'}\n\
          \        req = urllib.request.Request(file_url, headers=headers)\n     \
          \   \n        with urllib.request.urlopen(req, context=ssl_context) as response:\n\
          \            file_content = response.read()\n\n        # --- 2. 解析 Excel\
          \ (原生 XML) ---\n        data_rows = []\n        with zipfile.ZipFile(io.BytesIO(file_content))\
          \ as z:\n            # A. 获取共享字符串表\n            shared_strings = []\n  \
          \          try:\n                with z.open('xl/sharedStrings.xml') as\
          \ f:\n                    root = ET.parse(f).getroot()\n               \
          \     ns = {'main': 'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}\n\
          \                    for si in root.findall('.//main:si', ns):\n       \
          \                 t_node = si.find('.//main:t', ns)\n                  \
          \      text = t_node.text if t_node is not None else \"\"\n            \
          \            shared_strings.append(text)\n            except KeyError:\n\
          \                pass # 无共享字符串表，跳过\n\n            # B. 解析数据表 Sheet1\n  \
          \          with z.open('xl/worksheets/sheet1.xml') as f:\n             \
          \   root = ET.parse(f).getroot()\n                ns = {'main': 'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}\n\
          \                \n                rows = root.findall('.//main:row', ns)\n\
          \                headers = []\n                \n                for i,\
          \ row in enumerate(rows):\n                    row_values = []\n       \
          \             cells = row.findall('main:c', ns)\n                    \n\
          \                    for cell in cells:\n                        cell_type\
          \ = cell.get('t')\n                        v_node = cell.find('main:v',\
          \ ns)\n                        value = v_node.text if v_node is not None\
          \ else \"\"\n                        \n                        # 转换共享字符串引用\n\
          \                        if cell_type == 's' and value.isdigit():\n    \
          \                        try:\n                                value = shared_strings[int(value)]\n\
          \                            except:\n                                pass\n\
          \                        row_values.append(value)\n                    \n\
          \                    # 第一行为表头\n                    if i == 0:\n        \
          \                headers = row_values\n                    else:\n     \
